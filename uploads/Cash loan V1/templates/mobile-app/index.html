<!-- @template name="Mobile app shell" description="Maendeleo phone frame with brand app bar, content area, and bottom navigation — ready to fill." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Maendeleo — Mobile app</title>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="./ds-base.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: var(--neutral-95); }
  body { display: flex; align-items: center; justify-content: center; font-family: var(--font-sans); }
  .phone { width: 390px; height: 844px; background: var(--surface); border-radius: 44px; overflow: hidden;
           position: relative; box-shadow: 0 40px 90px rgba(0,0,0,.4), 0 0 0 11px #0c0d0e, 0 0 0 13px #2a2d31;
           display: flex; flex-direction: column; }
  .notch { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); width: 120px; height: 30px; background: #0c0d0e; border-radius: 0 0 18px 18px; z-index: 50; }
  @media (max-width: 430px) { body { background: var(--surface); } .phone { width: 100vw; height: 100vh; border-radius: 0; box-shadow: none; } .notch { display: none; } }
</style>
</head>
<body>
<div class="phone"><div class="notch"></div><div id="root" style="flex:1;min-height:0"></div></div>
<script type="text/babel" data-presets="react">
  window.addEventListener("DOMContentLoaded", () => {
    const DS = window.MaendeleoDesignSystem_e7e7ed;
    const { TopAppBar, BottomNav, Card, Button } = DS;

    function AppShell() {
      const [tab, setTab] = React.useState("home");
      return (
        <div style={{ display: "flex", flexDirection: "column", height: "100%" }}>
          {/* status bar */}
          <div style={{ background: "var(--primary)", height: 44, display: "flex", alignItems: "center",
                        justifyContent: "space-between", padding: "0 22px 0 26px", color: "#fff", font: "var(--type-label-large)" }}>
            <span style={{ fontWeight: 600 }}>9:41</span>
            <span style={{ width: 17, height: 11, border: "1.5px solid #fff", borderRadius: 3, opacity: .9 }} />
          </div>

          <div style={{ background: "var(--primary)" }}>
            <TopAppBar variant="brand" title="Maendeleo" subtitle="Within 5 miles"
              actions={[{ icon: "search", label: "Search" }, { icon: "bell", label: "Alerts" }]} />
          </div>

          {/* ── Replace this content area with your screen ── */}
          <div style={{ flex: 1, minHeight: 0, overflowY: "auto", padding: 16, background: "var(--background)" }}>
            <Card variant="elevated">
              <div className="m-title-large" style={{ color: "var(--on-surface)" }}>Start here</div>
              <p className="m-body-medium" style={{ color: "var(--on-surface-variant)" }}>
                Drop Maendeleo components into this area — ListItem, Chip, Rating, Input, and more.
              </p>
              <Button variant="primary" fullWidth iconLeft="plus">Primary action</Button>
            </Card>
          </div>

          <BottomNav value={tab} onChange={setTab} items={[
            { key: "home", icon: "home", label: "Home" },
            { key: "saved", icon: "heart", label: "Saved" },
            { key: "alerts", icon: "bell", label: "Alerts" },
            { key: "account", icon: "user", label: "Account" },
          ]} />
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<AppShell />);
  });
</script>
</body>
</html>
