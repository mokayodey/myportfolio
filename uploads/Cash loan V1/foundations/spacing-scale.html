<!-- @dsCard group="Spacing" viewport="700x170" name="Spacing scale" subtitle="4px base grid · 2 → 64" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 22px; background: var(--surface); font-family: var(--font-sans); }
  .scale { display: flex; align-items: flex-end; gap: 14px; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .bar { background: var(--primary); border-radius: 3px; width: 100%; }
  .v { font-family: var(--font-mono); font-size: 11px; color: var(--on-surface-variant); }
</style>
</head>
<body>
  <div class="scale" id="scale"></div>
  <script>
    const vals = [4,8,12,16,20,24,32,40,48,64];
    document.getElementById('scale').innerHTML = vals.map(v =>
      `<div class="item" style="width:${v}px"><div class="bar" style="height:${v}px"></div><span class="v">${v}</span></div>`
    ).join('');
  </script>
</body>
</html>
