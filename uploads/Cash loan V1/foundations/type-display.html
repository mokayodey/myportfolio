<!-- @dsCard group="Type" viewport="700x300" name="Display & Headline" subtitle="Inter Tight — expressive scale" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 24px; background: var(--surface); color: var(--on-surface); }
  .row { display: flex; align-items: baseline; gap: 16px; padding: 8px 0; border-bottom: 1px solid var(--outline-variant); }
  .row:last-child { border: none; }
  .spec { font: var(--type-body-small); font-family: var(--font-mono); color: var(--on-surface-variant); white-space: nowrap; min-width: 150px; }
</style>
</head>
<body>
  <div class="row"><span class="m-display-medium">Maendeleo</span><span class="spec">Display / 57·45·36</span></div>
  <div class="row"><span class="m-headline-large">Discover what's near</span><span class="spec">Headline Large / 32</span></div>
  <div class="row"><span class="m-headline-medium">Within 5 miles</span><span class="spec">Headline Medium / 28</span></div>
  <div class="row"><span class="m-headline-small">Section title</span><span class="spec">Headline Small / 24</span></div>
</body>
</html>
