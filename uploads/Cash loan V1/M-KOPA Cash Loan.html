<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M-KOPA Prototype: Cash Loan (List)</title>
<style>
  :root {
    --color-primary: #1F8A36;
    --color-primary-strong: #15772C;
    --color-on-primary: #FFFFFF;
    --color-primary-container: #D7F5DD;
    --color-offer-dark: #155E26;
    --color-offer-cta-bg: #DCF4E1;
    --color-amber: #F5A623;
    --color-bg: #ECEDEF;
    --color-surface: #FFFFFF;
    --color-field: #F3F4F5;
    --color-field-press: #E9EAEC;
    --color-on-surface: #1A1A1A;
    --color-on-surface-variant: #6B6F72;
    --color-outline: #D6D8DB;
    --color-outline-strong: #B4B8BC;
    --color-error: #E0312D;

    --type-headline-xl: 1.55rem;
    --type-headline-large: 1.7rem;
    --type-title-large: 1.375rem;
    --type-title-medium: 1.0625rem;
    --type-body-large: 1rem;
    --type-body-medium: 0.875rem;
    --type-label-large: 0.9375rem;
    --type-label-medium: 0.75rem;
    --type-label-small: 0.6875rem;

    --button-height: 3.25rem;
    --app-bar-height: 4rem;
    --radius-card: 1.5rem;
    --radius-pill: 1.75rem;
    --radius-field: 0.875rem;

    --space-1: 0.25rem; --space-2: 0.5rem; --space-3: 0.75rem;
    --space-4: 1rem; --space-5: 1.25rem; --space-6: 1.5rem;
    --font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; font-family: var(--font-family); background: #DDE0E2; color: var(--color-on-surface); display: flex; align-items: center; justify-content: center; }

  .device { width: 360px; height: 780px; background: var(--color-bg); border-radius: 34px; box-shadow: 0 18px 50px rgba(0,0,0,0.22); overflow: hidden; position: relative; display: flex; flex-direction: column; }

  .mkopa-status-bar { height: 30px; flex: 0 0 30px; display: flex; align-items: center; justify-content: space-between; padding: 0 var(--space-4) 0 var(--space-5); font-size: var(--type-label-medium); font-weight: 600; color: var(--color-on-surface); background: var(--color-bg); }
  .mkopa-status-bar__icons { display: flex; align-items: center; gap: 5px; }
  .mkopa-offline-indicator { display: none; font-size: var(--type-label-small); color: var(--color-on-primary); background: var(--color-outline-strong); text-align: center; padding: 2px 0; }

  .mkopa-screen { display: none; flex-direction: column; flex: 1; min-height: 0; }
  .mkopa-screen--active { display: flex; }
  .mkopa-content { flex: 1; overflow-y: auto; padding: var(--space-4) var(--space-4) var(--space-6); }
  .mkopa-content::-webkit-scrollbar { width: 4px; }
  .mkopa-content::-webkit-scrollbar-thumb { background: var(--color-outline-strong); border-radius: 2px; }

  .mkopa-headline-xl { font-size: var(--type-headline-xl); font-weight: 700; line-height: 1.18; letter-spacing: -0.3px; }
  .mkopa-headline-large { font-size: var(--type-headline-large); font-weight: 700; line-height: 1.15; }
  .mkopa-title-large { font-size: var(--type-title-large); font-weight: 700; }
  .mkopa-body-medium { font-size: var(--type-body-medium); }
  .text-variant { color: var(--color-on-surface-variant); }
  .mb-2 { margin-bottom: var(--space-2); }
  .mb-3 { margin-bottom: var(--space-3); }

  .mkopa-button { height: var(--button-height); border: none; border-radius: var(--radius-pill); font-size: var(--type-label-large); font-weight: 700; cursor: pointer; font-family: inherit; width: 100%; transition: background 0.12s ease, opacity 0.12s ease; }
  .mkopa-button--filled { background: var(--color-primary); color: var(--color-on-primary); }
  .mkopa-button--filled:active { background: var(--color-primary-strong); }
  .mkopa-button--filled:disabled { opacity: 0.38; cursor: not-allowed; }

  /* HOME */
  .mkopa-home-header { display: flex; align-items: center; justify-content: space-between; margin: var(--space-2) 0 var(--space-6); }
  .mkopa-home-header__greeting { font-size: var(--type-headline-large); font-weight: 700; }
  .mkopa-home-header__bell { position: relative; background: none; border: none; cursor: pointer; color: var(--color-on-surface); padding: 4px; }
  .mkopa-home-header__bell svg { width: 26px; height: 26px; }
  .mkopa-badge { position: absolute; top: -2px; right: -4px; background: var(--color-error); color: #fff; font-size: 0.625rem; font-weight: 700; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 9px; display: grid; place-items: center; border: 1.5px solid var(--color-bg); }

  .mkopa-offer-card { background: var(--color-offer-dark); color: var(--color-on-primary); border-radius: var(--radius-card); padding: var(--space-5); position: relative; overflow: hidden; }
  .mkopa-offer-card__title { font-size: var(--type-title-large); font-weight: 700; margin-bottom: var(--space-3); }
  .mkopa-offer-card__line { font-size: var(--type-body-large); margin-bottom: var(--space-2); max-width: 62%; }
  .mkopa-offer-card__cta { margin-top: var(--space-4); background: var(--color-offer-cta-bg); color: var(--color-primary-strong); border: none; border-radius: var(--radius-pill); font-weight: 700; padding: var(--space-3) var(--space-5); cursor: pointer; font-family: inherit; font-size: var(--type-label-large); }
  .mkopa-offer-card__cta:active { background: #C7ECCE; }
  .mkopa-offer-card__art { position: absolute; right: 14px; top: 50%; transform: translateY(-58%); width: 120px; height: 90px; }

  .mkopa-bottom-nav { flex: 0 0 auto; display: flex; justify-content: space-around; align-items: center; background: var(--color-surface); border-top: 1px solid var(--color-outline); padding: var(--space-2) 0 var(--space-3); }
  .mkopa-nav-item { display: flex; flex-direction: column; align-items: center; gap: 3px; background: none; border: none; cursor: pointer; color: var(--color-on-surface-variant); font-size: var(--type-label-small); font-family: inherit; }
  .mkopa-nav-item--active { color: var(--color-primary); }
  .mkopa-nav-item svg { width: 24px; height: 24px; }

  /* APP BAR */
  .mkopa-app-bar { height: var(--app-bar-height); flex: 0 0 var(--app-bar-height); display: flex; align-items: center; gap: var(--space-3); padding: 0 var(--space-4); background: var(--color-bg); }
  .mkopa-app-bar__back { width: 42px; height: 42px; flex: 0 0 42px; border-radius: 50%; background: var(--color-surface); border: none; cursor: pointer; display: grid; place-items: center; color: var(--color-on-surface); box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
  .mkopa-app-bar__back svg { width: 22px; height: 22px; }
  .mkopa-app-bar__title { font-size: var(--type-title-large); font-weight: 700; flex: 1; }
  .mkopa-app-bar__action { background: none; border: none; cursor: pointer; color: var(--color-primary); font-size: var(--type-label-large); font-weight: 700; padding: var(--space-2); }
  .mkopa-app-bar__action:active { opacity: 0.6; }

  /* SELECT (dropdown list) */
  .mkopa-select { position: relative; margin: var(--space-3) 0 var(--space-5); z-index: 10; }
  .mkopa-select__trigger {
    width: 100%; height: 56px; display: flex; align-items: center; justify-content: space-between;
    background: var(--color-field); border: 1.5px solid transparent; border-radius: var(--radius-field);
    padding: 0 var(--space-4); font-size: var(--type-title-medium); font-weight: 700;
    color: var(--color-on-surface); cursor: pointer; font-family: inherit;
  }
  .mkopa-select__trigger:active { background: var(--color-field-press); }
  .mkopa-select--open .mkopa-select__trigger { background: var(--color-surface); border-color: var(--color-primary); color: var(--color-primary); }
  .mkopa-select__chevron { color: var(--color-primary); transition: transform 0.18s ease; }
  .mkopa-select__chevron svg { width: 22px; height: 22px; display: block; }
  .mkopa-select--open .mkopa-select__chevron { transform: rotate(180deg); }

  .mkopa-select__menu {
    position: absolute; top: calc(100% + 6px); left: 0; right: 0;
    background: var(--color-surface); border: 1.5px solid var(--color-primary);
    border-radius: var(--radius-field); overflow: hidden; z-index: 40;
    box-shadow: 0 8px 24px rgba(0,0,0,0.14); display: none;
  }
  .mkopa-select--open .mkopa-select__menu { display: block; }
  .mkopa-select__option {
    height: 52px; display: flex; align-items: center; padding: 0 var(--space-4);
    font-size: var(--type-title-medium); font-weight: 700; cursor: pointer;
    border-bottom: 1px solid var(--color-outline); color: var(--color-on-surface);
  }
  .mkopa-select__option:last-child { border-bottom: none; }
  .mkopa-select__option:active { background: var(--color-field); }
  .mkopa-select__option--selected { background: var(--color-primary); color: var(--color-on-primary); }
  .mkopa-select__option--selected:active { background: var(--color-primary-strong); }

  /* DURATION OPTION CARDS */
  .mkopa-option { background: var(--color-surface); border-radius: var(--radius-card); padding: var(--space-4); margin-bottom: var(--space-2); cursor: pointer; border: 1.5px solid transparent; transition: border-color 0.12s ease, box-shadow 0.12s ease; }
  .mkopa-option--selected { border-color: var(--color-primary); box-shadow: 0 2px 12px rgba(0,0,0,0.07); }
  .mkopa-option__head { display: flex; align-items: center; justify-content: space-between; }
  .mkopa-option__left { display: flex; align-items: center; gap: var(--space-3); }
  .mkopa-radio { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--color-outline-strong); display: grid; place-items: center; flex: 0 0 auto; }
  .mkopa-option--selected .mkopa-radio { border-color: var(--color-primary); }
  .mkopa-radio__dot { width: 12px; height: 12px; border-radius: 50%; background: var(--color-primary); display: none; }
  .mkopa-option--selected .mkopa-radio__dot { display: block; }
  .mkopa-option__days { font-size: var(--type-title-medium); font-weight: 700; }
  .mkopa-option--selected .mkopa-option__days { color: var(--color-primary); }
  .mkopa-option__daily { font-size: var(--type-title-medium); font-weight: 700; }
  .mkopa-option__breakdown { display: none; margin-top: var(--space-3); padding-top: var(--space-3); border-top: 1px solid var(--color-outline); }
  .mkopa-option--selected .mkopa-option__breakdown { display: block; }
  .mkopa-option__row { display: flex; justify-content: space-between; font-size: var(--type-body-medium); margin-bottom: var(--space-2); }
  .mkopa-option__row:last-child { margin-bottom: 0; }
  .mkopa-option__row-label { color: var(--color-on-surface-variant); }
  .mkopa-option__row-value { font-weight: 700; }

  .mkopa-actions { flex: 0 0 auto; padding: var(--space-3) var(--space-4) var(--space-5); background: var(--color-surface); }
</style>
</head>
<body>
  <div class="device">
    <div class="mkopa-status-bar">
      <span>9:30</span>
      <div class="mkopa-status-bar__icons">
        <svg width="17" height="13" viewBox="0 0 17 13" fill="#1A1A1A"><path d="M8.5 2.2C5.6 2.2 3 3.3 1.1 5.1l1.3 1.4C4 5 6.1 4.1 8.5 4.1s4.5.9 6.1 2.4l1.3-1.4C14 3.3 11.4 2.2 8.5 2.2zm0 3.8c-1.7 0-3.3.7-4.4 1.8L8.5 12 13 7.8C11.8 6.7 10.2 6 8.5 6z"/></svg>
        <svg width="17" height="13" viewBox="0 0 17 13" fill="#1A1A1A"><path d="M1 11h3V6H1v5zm5 0h3V3H6v8zm5 0h4V0h-4v11z"/></svg>
        <svg width="13" height="13" viewBox="0 0 24 24" fill="#1A1A1A"><path d="M15 4h1a1 1 0 011 1v1h1v4h-1v8a1 1 0 01-1 1H6a1 1 0 01-1-1V5a1 1 0 011-1h9z"/></svg>
      </div>
    </div>
    <div class="mkopa-offline-indicator" id="offline-indicator">No internet connection</div>

    <!-- ============ SCREEN 1: HOME ============ -->
    <section class="mkopa-screen mkopa-screen--active" data-screen="home" data-screen-label="Home">
      <main class="mkopa-content">
        <div class="mkopa-home-header">
          <h1 class="mkopa-home-header__greeting">Hi Jane 👋</h1>
          <button class="mkopa-home-header__bell" aria-label="Notifications">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 8a6 6 0 00-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 01-3.4 0"/></svg>
            <span class="mkopa-badge">99</span>
          </button>
        </div>

        <h2 class="mkopa-title-large mb-3">Offers</h2>

        <div class="mkopa-offer-card">
          <svg class="mkopa-offer-card__art" viewBox="0 0 120 90" fill="none">
            <g transform="rotate(-8 60 45)">
              <rect x="20" y="40" width="84" height="40" rx="4" fill="#1E7A33"/>
              <rect x="16" y="32" width="84" height="40" rx="4" fill="#2E9E45"/>
              <rect x="12" y="24" width="84" height="40" rx="4" fill="#49C463"/>
              <rect x="12" y="38" width="84" height="9" fill="#F5A623"/>
              <circle cx="54" cy="44" r="11" fill="none" stroke="#1E7A33" stroke-width="2.5"/>
            </g>
          </svg>
          <div class="mkopa-offer-card__title">Congratulations!</div>
          <div class="mkopa-offer-card__line">• Cash loans are available.</div>
          <div class="mkopa-offer-card__line">• Up to KES 15,000</div>
          <button class="mkopa-offer-card__cta" data-navigate="cashloan">Apply now</button>
        </div>
      </main>

      <nav class="mkopa-bottom-nav">
        <button class="mkopa-nav-item mkopa-nav-item--active"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3l9 8h-2.5v9h-5v-6h-3v6h-5v-9H3z"/></svg>Home</button>
        <button class="mkopa-nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M8 14V11M12 14V8M16 14v-2"/></svg>Product</button>
        <button class="mkopa-nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.2"/></svg>Payments</button>
        <button class="mkopa-nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.4a2.4 2.4 0 014.6.9c0 1.6-2.2 2-2.2 3.2"/><circle cx="12" cy="17" r="0.6" fill="currentColor"/></svg>Help</button>
        <button class="mkopa-nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="6" height="6" rx="1.5"/><rect x="14" y="4" width="6" height="6" rx="1.5"/><rect x="4" y="14" width="6" height="6" rx="1.5"/><rect x="14" y="14" width="6" height="6" rx="1.5"/></svg>More</button>
      </nav>
    </section>

    <!-- ============ SCREEN 2: CASH LOAN (LIST / DROPDOWN) ============ -->
    <section class="mkopa-screen" data-screen="cashloan" data-screen-label="Cash loan">
      <header class="mkopa-app-bar">
        <button class="mkopa-app-bar__back" data-navigate="home" aria-label="Back">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 5l-7 7 7 7"/></svg>
        </button>
        <h1 class="mkopa-app-bar__title">Cash loan</h1>
        <button class="mkopa-app-bar__action" data-navigate="home">Cancel</button>
      </header>

      <main class="mkopa-content">
        <h2 class="mkopa-headline-xl mb-2">How much would you like?</h2>
        <p class="mkopa-body-medium text-variant mb-3">Select the amount of money and the amount of days you want to pay.</p>

        <div class="mkopa-select" id="select">
          <button class="mkopa-select__trigger" id="select-trigger" aria-haspopup="listbox">
            <span id="select-value">KES 5,000</span>
            <span class="mkopa-select__chevron">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 9l6 6 6-6"/></svg>
            </span>
          </button>
          <div class="mkopa-select__menu" id="select-menu" role="listbox"></div>
        </div>

        <div id="options-list"></div>
      </main>

      <footer class="mkopa-actions">
        <button class="mkopa-button mkopa-button--filled" id="next-step-btn">Next step</button>
      </footer>
    </section>
  </div>

<script>
  const AMOUNTS = [5000, 9000, 12000, 15000];
  const OFFERS = {
    5000:  [{days:80, daily:69}, {days:107, daily:55}, {days:130, daily:49}],
    9000:  [{days:120, daily:86}, {days:145, daily:75}, {days:165, daily:71}],
    12000: [{days:130, daily:108}, {days:157, daily:95}, {days:180, daily:89}],
    15000: [{days:150, daily:121}, {days:176, daily:110}, {days:196, daily:105}]
  };

  const state = { amountIndex: 0, durationIndex: 0 };
  const fmt = n => 'KES ' + n.toLocaleString('en-US');

  function navigateTo(screen) {
    document.querySelectorAll('.mkopa-screen').forEach(s => s.classList.remove('mkopa-screen--active'));
    document.querySelector('[data-screen="' + screen + '"]').classList.add('mkopa-screen--active');
    document.getElementById('select').classList.remove('mkopa-select--open');
    const content = document.querySelector('[data-screen="' + screen + '"] .mkopa-content');
    if (content) content.scrollTop = 0;
  }
  document.querySelectorAll('[data-navigate]').forEach(el => {
    el.addEventListener('click', () => navigateTo(el.getAttribute('data-navigate')));
  });

  // Dropdown open/close
  const selectEl = document.getElementById('select');
  document.getElementById('select-trigger').addEventListener('click', (e) => {
    e.stopPropagation();
    selectEl.classList.toggle('mkopa-select--open');
  });
  document.addEventListener('click', (e) => {
    if (!selectEl.contains(e.target)) selectEl.classList.remove('mkopa-select--open');
  });

  function renderSelect() {
    document.getElementById('select-value').textContent = fmt(AMOUNTS[state.amountIndex]);
    const menu = document.getElementById('select-menu');
    menu.innerHTML = '';
    AMOUNTS.forEach((amount, i) => {
      const opt = document.createElement('div');
      opt.className = 'mkopa-select__option' + (i === state.amountIndex ? ' mkopa-select__option--selected' : '');
      opt.setAttribute('role', 'option');
      opt.textContent = fmt(amount);
      opt.addEventListener('click', (e) => {
        e.stopPropagation();
        state.amountIndex = i;
        state.durationIndex = 0;
        selectEl.classList.remove('mkopa-select--open');
        renderSelect();
        renderOptions();
      });
      menu.appendChild(opt);
    });
  }

  function renderOptions() {
    const amount = AMOUNTS[state.amountIndex];
    const options = OFFERS[amount];
    const list = document.getElementById('options-list');
    list.innerHTML = '';
    options.forEach((opt, i) => {
      const total = opt.days * opt.daily;
      const interest = total - amount;
      const selected = i === state.durationIndex;
      const card = document.createElement('div');
      card.className = 'mkopa-option' + (selected ? ' mkopa-option--selected' : '');
      card.innerHTML =
        '<div class="mkopa-option__head">' +
          '<div class="mkopa-option__left">' +
            '<div class="mkopa-radio"><div class="mkopa-radio__dot"></div></div>' +
            '<div class="mkopa-option__days">' + opt.days + ' days</div>' +
          '</div>' +
          '<div class="mkopa-option__daily">' + fmt(opt.daily) + ' daily</div>' +
        '</div>' +
        '<div class="mkopa-option__breakdown">' +
          '<div class="mkopa-option__row"><span class="mkopa-option__row-label">Total amount to pay back</span><span class="mkopa-option__row-value">' + fmt(total) + '</span></div>' +
          '<div class="mkopa-option__row"><span class="mkopa-option__row-label">Interest and fees</span><span class="mkopa-option__row-value">' + fmt(interest) + '</span></div>' +
        '</div>';
      card.addEventListener('click', () => { state.durationIndex = i; renderOptions(); });
      list.appendChild(card);
    });
  }

  renderSelect();
  renderOptions();
</script>
</body>
</html>
