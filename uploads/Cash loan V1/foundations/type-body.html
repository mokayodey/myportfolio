<!-- @dsCard group="Type" viewport="700x320" name="Title, Body & Label" subtitle="Inter — UI & reading text" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 24px; background: var(--surface); color: var(--on-surface); }
  .row { display: flex; align-items: baseline; gap: 16px; padding: 7px 0; border-bottom: 1px solid var(--outline-variant); }
  .row:last-child { border: none; }
  .spec { font-family: var(--font-mono); font-size: 12px; color: var(--on-surface-variant); white-space: nowrap; margin-left: auto; }
</style>
</head>
<body>
  <div class="row"><span class="m-title-large">Title large</span><span class="spec">600 · 22/28</span></div>
  <div class="row"><span class="m-title-medium">Title medium</span><span class="spec">600 · 16/24</span></div>
  <div class="row"><span class="m-body-large">Body large — supporting line text lorem ipsum.</span><span class="spec">400 · 16/24</span></div>
  <div class="row"><span class="m-body-medium">Body medium — Category · $$ · 1.2 miles away</span><span class="spec">400 · 14/20</span></div>
  <div class="row"><span class="m-body-small">Body small — fine print and helper copy.</span><span class="spec">400 · 12/16</span></div>
  <div class="row"><span class="m-label-large">LABEL LARGE</span><span class="spec">500 · 14/20</span></div>
  <div class="row"><span class="m-label-medium">LABEL MEDIUM</span><span class="spec">500 · 12/16</span></div>
</body>
</html>
