<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; padding: 24px; background: var(--background); }
  .wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; max-width: 652px; }
  .panel { background: var(--surface); border-radius: var(--radius-md); padding: 20px; box-shadow: var(--elevation-1); }
  .col { display: flex; flex-direction: column; gap: 16px; }
  .lbl { font: var(--type-label-small); letter-spacing: var(--tracking-label); text-transform: uppercase; color: var(--on-surface-variant); margin-bottom: 14px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { Input, Checkbox, Switch } = window.MaendeleoDesignSystem_e7e7ed;
  function Demo() {
    const [q, setQ] = React.useState("Karibu Market");
    const [c1, setC1] = React.useState(true);
    const [c2, setC2] = React.useState(false);
    const [sw1, setSw1] = React.useState(true);
    const [sw2, setSw2] = React.useState(false);
    return (
      <div className="wrap">
        <div className="panel col" style={{ gridColumn: "1 / -1" }}>
          <div className="lbl">Text fields</div>
          <div className="col" style={{ flexDirection: "row" }}>
            <Input label="Search" leadingIcon="search" value={q} onChange={(e)=>setQ(e.target.value)} />
            <Input label="Email" leadingIcon="send" placeholder="you@example.com" supportingText="We'll never share it." />
            <Input label="Password" leadingIcon="lock" trailingIcon="eye" type="password" value="secret" error supportingText="Too short" onChange={()=>{}} />
          </div>
        </div>
        <div className="panel col">
          <div className="lbl">Checkboxes</div>
          <Checkbox label="Open now" checked={c1} onChange={()=>setC1(!c1)} />
          <Checkbox label="Free entry" checked={c2} onChange={()=>setC2(!c2)} />
          <Checkbox label="Unavailable" checked disabled />
        </div>
        <div className="panel col">
          <div className="lbl">Switches</div>
          <Switch label="Push notifications" checked={sw1} onChange={setSw1} />
          <Switch label="Location services" checked={sw2} onChange={setSw2} />
          <Switch label="Locked setting" checked disabled />
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body>
</html>
