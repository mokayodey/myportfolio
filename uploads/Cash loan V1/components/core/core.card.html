<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; padding: 24px; background: var(--background); }
  .grid { display: flex; flex-direction: column; gap: 20px; max-width: 652px; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
  .panel { background: var(--surface); border-radius: var(--radius-md); padding: 18px 20px; box-shadow: var(--elevation-1); }
  .lbl { font: var(--type-label-small); letter-spacing: var(--tracking-label); text-transform: uppercase; color: var(--on-surface-variant); margin-bottom: 12px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { Button, IconButton, Chip, Badge, Avatar, Icon } = window.MaendeleoDesignSystem_e7e7ed;

  function Demo() {
    const [sel, setSel] = React.useState("open");
    return (
      <div className="grid">
        <div className="panel">
          <div className="lbl">Pill buttons</div>
          <div className="row" style={{ marginBottom: 12 }}>
            <Button variant="primary">Primary</Button>
            <Button variant="secondary">Secondary</Button>
            <Button variant="tertiary">Tertiary</Button>
            <Button variant="ghost">Ghost</Button>
            <Button variant="error">Delete</Button>
            <Button variant="primary" disabled>Disabled</Button>
          </div>
          <div className="row">
            <Button variant="primary" size="small" iconLeft="plus">Small</Button>
            <Button variant="primary" size="medium" iconLeft="marker">Medium</Button>
            <Button variant="primary" size="large" iconRight="chevron-right">Large</Button>
          </div>
        </div>

        <div className="panel">
          <div className="lbl">Icon buttons</div>
          <div className="row">
            <IconButton icon="heart" variant="filled" label="Save" />
            <IconButton icon="share" variant="outlined" label="Share" />
            <IconButton icon="dots-vertical" variant="ghost" label="More" />
            <IconButton icon="bell" variant="tonal" label="Alerts" />
            <IconButton icon="settings" variant="ghost" disabled label="Settings" />
          </div>
        </div>

        <div className="panel">
          <div className="lbl">Filter chips</div>
          <div className="row">
            {["open", "nearby", "top", "deals"].map((k) => (
              <Chip key={k} selected={sel === k} onClick={() => setSel(k)}>
                {k[0].toUpperCase() + k.slice(1)}
              </Chip>
            ))}
            <Chip leadingIcon="filter">Filters</Chip>
          </div>
        </div>

        <div className="panel">
          <div className="lbl">Badges &amp; avatars</div>
          <div className="row">
            <Badge tone="success">New</Badge>
            <Badge tone="warning">Pending</Badge>
            <Badge tone="critical">3</Badge>
            <Badge tone="info">Info</Badge>
            <Badge tone="soft">Saved</Badge>
            <Badge dot tone="success" />
            <span style={{ width: 8 }} />
            <Avatar name="Amani Juma" />
            <Avatar name="Zola K" style={{ background: "var(--secondary-container)", color: "var(--on-secondary-container)" }} />
            <span style={{ display: "inline-flex", alignItems: "center", gap: 6, color: "var(--on-surface-variant)", font: "var(--type-body-medium)" }}>
              <Icon name="marker" size={18} /> 1.2 miles away
            </span>
          </div>
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body>
</html>
