<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Maendeleo — Discovery</title>
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: var(--neutral-95); }
  body { display: flex; align-items: center; justify-content: center; font-family: var(--font-sans); }
  .phone {
    width: 390px; height: 844px; background: var(--surface);
    border-radius: 44px; overflow: hidden; position: relative;
    box-shadow: 0 40px 90px rgba(0,0,0,.4), 0 0 0 11px #0c0d0e, 0 0 0 13px #2a2d31;
    display: flex; flex-direction: column;
  }
  .notch { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); width: 120px; height: 30px; background: #0c0d0e; border-radius: 0 0 18px 18px; z-index: 50; }
  .screen { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  @media (max-width: 430px) {
    body { background: var(--surface); }
    .phone { width: 100vw; height: 100vh; border-radius: 0; box-shadow: none; }
    .notch { display: none; }
  }
</style>
</head>
<body>
<div class="phone">
  <div class="notch"></div>
  <div class="screen"><div id="root" style="height:100%"></div></div>
</div>
<script src="data.js"></script>
<script type="text/babel" src="shared.jsx"></script>
<script type="text/babel" src="ExploreScreen.jsx"></script>
<script type="text/babel" src="DetailScreen.jsx"></script>
<script type="text/babel" src="ReviewsScreen.jsx"></script>
<script type="text/babel" src="AccountScreen.jsx"></script>
<script type="text/babel" src="App.jsx"></script>
<script type="text/babel">
  ReactDOM.createRoot(document.getElementById("root")).render(<window.App />);
</script>
</body>
</html>
