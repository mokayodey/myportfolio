<!-- @dsCard group="Spacing" viewport="700x190" name="Elevation" subtitle="Soft ambient shadow ramp, 1 → 5" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 28px 22px; background: var(--background); font-family: var(--font-sans); }
  .row { display: flex; gap: 28px; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .box { width: 96px; height: 72px; background: var(--surface); border-radius: var(--radius-md); }
  .v { font-family: var(--font-mono); font-size: 11px; color: var(--on-surface-variant); }
</style>
</head>
<body>
  <div class="row" id="row"></div>
  <script>
    [1,2,3,4,5].forEach(() => {});
    document.getElementById('row').innerHTML = [1,2,3,4,5].map(n =>
      `<div class="item"><div class="box" style="box-shadow:var(--elevation-${n})"></div><span class="v">elevation-${n}</span></div>`
    ).join('');
  </script>
</body>
</html>
