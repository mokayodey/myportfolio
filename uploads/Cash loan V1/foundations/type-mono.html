<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 24px; background: var(--surface); color: var(--on-surface); }
  .mono { font-family: var(--font-mono); display: flex; flex-direction: column; gap: 8px; }
  .mono span { font-size: 13px; }
  .g { color: var(--on-surface-variant); }
  .k { color: var(--primary); font-weight: 500; }
</style>
</head>
<body>
  <div class="mono">
    <span><span class="k">--primary</span><span class="g">: var(--green-80); /* #2F8822 */</span></span>
    <span><span class="k">--radius-md</span><span class="g">: 16px;</span></span>
    <span class="g">Design system v1.0 — Generated: 09/23/2025</span>
  </div>
</body>
</html>
