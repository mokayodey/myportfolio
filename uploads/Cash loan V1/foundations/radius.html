<!-- @dsCard group="Spacing" viewport="700x170" name="Corner radius" subtitle="xs 8 · sm 12 · md 16 · lg 20 · xl 28 · full" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 22px; background: var(--surface); font-family: var(--font-sans); }
  .row { display: flex; gap: 16px; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .box { width: 84px; height: 84px; background: var(--primary-container); border: 2px solid var(--primary); }
  .v { font-family: var(--font-mono); font-size: 11px; color: var(--on-surface-variant); text-align: center; }
</style>
</head>
<body>
  <div class="row" id="row"></div>
  <script>
    const r = [["xs","8"],["sm","12"],["md","16"],["lg","20"],["xl","28"],["full","pill"]];
    document.getElementById('row').innerHTML = r.map(([k,v]) =>
      `<div class="item"><div class="box" style="border-radius:var(--radius-${k})"></div><span class="v">${k}<br>${v}</span></div>`
    ).join('');
  </script>
</body>
</html>
