<!-- @dsCard group="Colors" viewport="700x150" name="Primary — Green scale" subtitle="Brand green tonal ramp, 10→98" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 20px; background: var(--surface); font-family: var(--font-sans); }
  .ramp { display: flex; gap: 0; border-radius: var(--radius-sm); overflow: hidden; }
  .sw { flex: 1; height: 88px; display: flex; align-items: flex-end; padding: 6px; box-sizing: border-box; }
  .sw span { font: var(--type-label-small); letter-spacing: var(--tracking-label); }
  .cap { margin-top: 12px; display: flex; gap: 8px; align-items: baseline; }
  .cap b { font: var(--type-title-small); color: var(--on-surface); }
  .cap em { font: var(--type-body-small); color: var(--on-surface-variant); font-style: normal; }
</style>
</head>
<body>
  <div class="ramp" id="ramp"></div>
  <div class="cap"><b>Primary · Green</b><em>--primary = green/80 (#2F8822) · base scale --green-10 … --green-98</em></div>
  <script>
    const steps = [10,15,20,25,30,35,40,45,50,60,70,80,85,90,95,98];
    document.getElementById('ramp').innerHTML = steps.map(s => {
      const light = s <= 45;
      return `<div class="sw" style="background:var(--green-${s})"><span style="color:${light?'#0F2D0B':'#fff'}">${s}</span></div>`;
    }).join('');
  </script>
</body>
</html>
