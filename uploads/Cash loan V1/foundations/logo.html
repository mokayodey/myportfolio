<!-- @dsCard group="Brand" viewport="700x300" name="Logo" subtitle="Mark + wordmark, on light / green / dark" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 24px; background: var(--surface); font-family: var(--font-sans); }
  .lockup { display: flex; align-items: center; gap: 24px; margin-bottom: 20px; }
  .lockup img { height: 44px; }
  .tiles { display: grid; grid-template-columns: repeat(3,1fr); gap: 14px; }
  .tile { height: 120px; border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; }
  .tile svg { width: 50px; height: 60px; }
  .cap { font: var(--type-body-small); color: var(--on-surface-variant); margin-top: 10px; }
</style>
</head>
<body>
  <div class="lockup">
    <img src="../assets/logo/maendeleo-wordmark.svg" alt="Maendeleo" />
  </div>
  <div class="tiles">
    <div class="tile" style="background:var(--surface);border:1px solid var(--outline-variant);color:var(--logo-green)">
      <svg viewBox="0 0 84 99.5" fill="currentColor"><path d="M 0 76 L 0 23 L 14.5 25.5 L 14.5 72 L 0 76 Z"/><path d="M 47.5 16.5 L 26.5 10 L 26.5 90 L 47.5 81 L 47.5 16.5 Z"/><path d="M 59 99.5 L 59 0 L 84 13.5 L 84 81 L 59 99.5 Z"/></svg>
    </div>
    <div class="tile" style="background:var(--brand-green);color:#fff">
      <svg viewBox="0 0 84 99.5" fill="currentColor"><path d="M 0 76 L 0 23 L 14.5 25.5 L 14.5 72 L 0 76 Z"/><path d="M 47.5 16.5 L 26.5 10 L 26.5 90 L 47.5 81 L 47.5 16.5 Z"/><path d="M 59 99.5 L 59 0 L 84 13.5 L 84 81 L 59 99.5 Z"/></svg>
    </div>
    <div class="tile" style="background:var(--neutral-98);color:var(--logo-green)">
      <svg viewBox="0 0 84 99.5" fill="currentColor"><path d="M 0 76 L 0 23 L 14.5 25.5 L 14.5 72 L 0 76 Z"/><path d="M 47.5 16.5 L 26.5 10 L 26.5 90 L 47.5 81 L 47.5 16.5 Z"/><path d="M 59 99.5 L 59 0 L 84 13.5 L 84 81 L 59 99.5 Z"/></svg>
    </div>
  </div>
  <div class="cap">Three ascending bars = progress / growth. Mark uses logo-green #39B54A; wordmark in Inter Tight.</div>
</body>
</html>
